name: Update cricket data

on:
  schedule:
    # Runs daily at 02:00 UTC (about 7:30 AM India time)
    - cron: '0 2 * * *'
  workflow_dispatch:        # also lets you trigger it manually from the Actions tab

permissions:
  contents: write           # needed so the workflow can commit + push updated data

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download latest data
        run: python scripts/download_data.py

      - name: Rebuild cache
        run: python scripts/build_cache.py

      - name: Rebuild registry
        run: python scripts/build_registry.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/deliveries.parquet data/players.parquet
          if git diff --staged --quiet; then
            echo "No data changes — nothing to commit."
          else
            git commit -m "Auto-update cricket data ($(date -u +%Y-%m-%d))"
            git push
          fi